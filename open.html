<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ouverture des pages</title>
</head>
<body>
    <h1>Ouverture des pages en cours...</h1>
    <p>Si les onglets ne s'ouvrent pas automatiquement, 
    <a href="#" id="manual">cliquez ici</a>.</p>

    <script>
        const urls = [
            "https://lost-cyrano.github.io/maths/",
            "https://www.atrium-sud.fr/connexion/login",
            "https://www.youtube.com/",
            "https://chat.deepseek.com/"
        ];

        function openAll() {
            urls.forEach(url => {
                window.open(url, '_blank');
            });
        }

        // Tentative d'ouverture automatique
        window.addEventListener('load', openAll);

        // Lien de secours (les navigateurs bloquent souvent les pop-ups)
        document.getElementById('manual').addEventListener('click', function(e) {
            e.preventDefault();
            openAll();
        });
    </script>
</body>
</html>
